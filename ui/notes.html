<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: rgba(19,19,23,.94); --line: rgba(255,255,255,.09);
    --txt: #eaeaef; --dim: #8b8b98; --accent: #e35244;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: transparent; overflow: hidden;
    font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; color: var(--txt);
  }
  #win {
    display: flex; flex-direction: column; width: 100%; height: 100%;
    background: var(--bg); backdrop-filter: blur(18px);
    border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
  }
  #titlebar {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    border-bottom: 1px solid var(--line); cursor: default;
  }
  #titlebar .mark {
    width: 26px; height: 26px; border-radius: 9px; flex: none;
    background: var(--accent); display: flex; align-items: center; justify-content: center;
  }
  #titlebar .mark svg { width: 14px; height: 14px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #titlebar .t { font-size: 12.5px; font-weight: 600; }
  #titlebar .live { display: none; align-items: center; gap: 6px; color: var(--dim); font-size: 11px; }
  #titlebar .live .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: blink 1.1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .isrec #titlebar .live { display: flex; }
  #close { margin-left: auto; border: 0; background: none; color: var(--dim); cursor: pointer;
    width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  #close:hover { background: rgba(255,255,255,.08); color: var(--txt); }
  #close svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  #live {
    display: none; padding: 9px 16px 2px; color: var(--dim); font-size: 11.5px;
    line-height: 1.4; white-space: pre-wrap; max-height: 64px; overflow: hidden;
  }
  .isrec #live { display: block; }
  #pad {
    flex: 1; width: 100%; resize: none; border: 0; outline: none; background: transparent;
    color: var(--txt); font-size: 13.5px; line-height: 1.55; padding: 12px 16px;
    caret-color: var(--accent); user-select: text;
  }
  #pad::placeholder { color: #55555e; }
  #foot {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    border-top: 1px solid var(--line);
  }
  .btn {
    display: flex; align-items: center; gap: 6px; padding: 7px 14px; border: 0;
    border-radius: 9px; font-size: 12px; cursor: pointer; font-family: inherit; font-weight: 600;
  }
  .btn svg { width: 13.5px; height: 13.5px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: rgba(255,255,255,.07); color: #c9c9d2; }
  .btn.ghost:hover { background: rgba(255,255,255,.12); }
  #count { margin-left: auto; color: var(--dim); font-size: 11px; }
</style>
</head>
<body>
<div id="win">
  <div id="titlebar" data-tauri-drag-region>
    <div class="mark" data-tauri-drag-region>
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 7a5 5 0 1 0 5 5"/><path d="M12 11.5v.5"/></svg>
    </div>
    <span class="t" data-tauri-drag-region>Notes</span>
    <span class="live"><span class="dot"></span> Listening&hellip;</span>
    <button id="close" title="Hide"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div id="live"></div>
  <textarea id="pad" placeholder="Dictate or type here&hellip; &#10;&#10;Open this window, start dictating (hold hotkey anywhere) &mdash; everything lands here. Then paste it wherever you want."></textarea>
  <div id="foot">
    <button class="btn primary" id="insert">
      <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v5"/></svg>Insert text
    </button>
    <button class="btn ghost" id="copy">
      <svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy
    </button>
    <button class="btn ghost" id="clear">
      <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>Clear
    </button>
    <span id="count"></span>
  </div>
</div>
<script>
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  const pad = document.getElementById("pad");
  const live = document.getElementById("live");
  const winBox = document.getElementById("win");
  const count = document.getElementById("count");

  function updCount() {
    const n = pad.value.trim() ? pad.value.trim().split(/\s+/).length : 0;
    count.textContent = n + " words";
  }
  pad.addEventListener("input", updCount); updCount();

  listen("record-state", e => winBox.classList.toggle("isrec", e.payload === "started"));
  listen("partial", e => { if (winBox.classList.contains("isrec")) live.textContent = e.payload; });
  listen("final", () => { live.textContent = ""; });
  listen("note-append", e => {
    const t = String(e.payload || "").trim();
    if (!t) return;
    pad.value += (pad.value && !pad.value.endsWith("\n") ? "\n" : "") + t;
    pad.scrollTop = pad.scrollHeight;
    updCount();
  });

  document.getElementById("close").addEventListener("click", async () => { try { await invoke("show_notes"); } catch (e) {} });
  document.getElementById("insert").addEventListener("click", async () => {
    try {
      await invoke("insert_notes_text", { text: pad.value });
      pad.value = ""; updCount();
    } catch (e) { count.textContent = String(e); }
  });
  document.getElementById("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(pad.value); count.textContent = "Copied"; }
    catch (e) { count.textContent = String(e); }
  });
  document.getElementById("clear").addEventListener("click", () => { pad.value = ""; updCount(); });
</script>
</body>
</html>
